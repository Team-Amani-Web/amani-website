# Team AMANI — Astro site

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Demo admin panel. Fake login, browser-local data — not a real system.
# Renamed to an unguessable path because Netlify password protection is Pro-only.
[[redirects]]
  from = "/admin"
  to = "/admin-a7f3c9.html"
  status = 200

# NOTE: no catch-all redirect. Real pages now exist, and a catch-all would
# hide genuine broken links behind the homepage.

# The Studio is a single-page app — every /studio/* path must serve its shell.
[[redirects]]
  from = "/studio/*"
  to = "/studio/index.html"
  status = 200
